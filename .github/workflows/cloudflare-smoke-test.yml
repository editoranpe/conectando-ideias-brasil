name: Verify Cloudflare Worker URL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify homepage and API over HTTPS
        shell: bash
        run: |
          set -u
          SITE='https://conectando-ideias-brasil.jeferson-samagaia.workers.dev'
          code=$(curl -L --silent --show-error --max-time 25 -o /tmp/cib-home.html -w '%{http_code}' "$SITE/" || true)
          echo "Homepage HTTP: $code"
          head -c 280 /tmp/cib-home.html 2>/dev/null || true
          echo
          if [ "$code" != '200' ] || ! grep -qi 'Conectando Ideias Brasil' /tmp/cib-home.html; then
            echo 'Homepage not yet serving the Conectando Ideias Brasil website.'
            exit 1
          fi
          health=$(curl -L --silent --show-error --max-time 25 -o /tmp/cib-health.json -w '%{http_code}' "$SITE/api/health" || true)
          echo "API health HTTP: $health"
          head -c 600 /tmp/cib-health.json 2>/dev/null || true
          echo
          echo 'Homepage online; HTTP 503 from /api/health means D1 binding is not configured yet.'
