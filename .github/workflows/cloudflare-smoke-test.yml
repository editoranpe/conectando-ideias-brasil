name: Verify Cloudflare Worker URL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-smoke-test.yml'
      - 'dist/index.html'
      - 'wrangler.jsonc'
      - 'functions/_lib/schema.ts'
      - 'functions/api/[[path]].ts'
      - 'src/worker.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify site and D1 readiness (no secrets required)
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://conectando-ideias-brasil.jeferson-samagaia.workers.dev'
          homepage=$(curl -L --silent --show-error --max-time 20 -o /tmp/cib-home.html -w '%{http_code}' "$SITE/")
          echo "Homepage HTTP: $homepage"
          test "$homepage" = '200'
          grep -qi 'Conectando Ideias Brasil' /tmp/cib-home.html
          grep -q 'id="root"' /tmp/cib-home.html
          echo 'Frontend React disponível.'
          release_status=000
          for attempt in $(seq 1 12); do
            release_status=$(curl -L --silent --show-error --max-time 20 -o /tmp/cib-release.json -w '%{http_code}' "$SITE/api/version" || true)
            echo "Worker version tentativa $attempt: HTTP $release_status"
            cat /tmp/cib-release.json 2>/dev/null || true
            echo
            if [ "$release_status" = '200' ] && grep -q '2026-11-05-db-bootstrap-v1' /tmp/cib-release.json; then break; fi
            sleep 10
          done
          if [ "$release_status" != '200' ] || ! grep -q '2026-11-05-db-bootstrap-v1' /tmp/cib-release.json; then
            echo 'Cloudflare ainda serve um Worker antigo. Verifique Settings > Builds / Deployments.'
            exit 1
          fi
          api_status=000
          for attempt in $(seq 1 9); do
            api_status=$(curl -L --silent --show-error --max-time 20 -o /tmp/cib-health.json -w '%{http_code}' "$SITE/api/health" || true)
            echo "API health tentativa $attempt: HTTP $api_status"
            cat /tmp/cib-health.json 2>/dev/null || true
            echo
            if [ "$api_status" = '200' ]; then break; fi
            sleep 10
          done
          if [ "$api_status" != '200' ]; then
            echo 'Binding DB ainda não está disponível no Worker. Verifique Workers & Pages > Bindings e o deploy do Cloudflare.'
            exit 1
          fi
          setup_status=000
          for attempt in $(seq 1 15); do
            setup_status=$(curl -L --silent --show-error --max-time 20 -o /tmp/cib-setup.json -w '%{http_code}' "$SITE/api/setup-status" || true)
            echo "API setup-status tentativa $attempt: HTTP $setup_status"
            cat /tmp/cib-setup.json 2>/dev/null || true
            echo
            if [ "$setup_status" = '200' ]; then break; fi
            sleep 10
          done
          if [ "$setup_status" = '200' ]; then
            echo 'D1 acessível e tabelas iniciais presentes.'
          else
            echo 'O D1 está conectado, mas a inicialização automática do schema ainda não está disponível. Verifique o deploy no Cloudflare e revise migrations/0001_initial.sql.'
            exit 1
          fi
