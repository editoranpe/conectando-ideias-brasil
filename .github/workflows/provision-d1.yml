name: Provision and connect Cloudflare D1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cib-provision-d1
  cancel-in-progress: false

jobs:
  provision:
    if: github.ref == 'refs/heads/main' && github.repository == 'editoranpe/conectando-ideias-brasil'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure authorization is configured
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN as GitHub Actions repository secrets.'
            exit 1
          fi
      - name: Install CLI
        run: npm install --no-audit --no-fund
      - name: Check provisioning behavior without network
        run: node --test tests/provision-d1.test.mjs
      - name: Locate or create D1 and configure binding
        run: node scripts/provision-d1.mjs
      - name: Apply initial D1 migrations remotely
        run: npx wrangler d1 migrations apply DB --remote
      - name: Commit persistent DB binding for Cloudflare Builds
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.jsonc
          if ! git diff --cached --quiet; then
            git commit -m "infra: connect Cloudflare D1 database to Worker"
            git push origin HEAD:main
          else
            echo 'D1 binding already present in the repository.'
          fi
          echo 'Cloudflare Workers Builds will redeploy on the next binding commit.'